global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "/etc/prometheus/alerts/*.yml"

alerting:
  alertmanagers:
    - scheme: http
      static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "demo-api-probes"
    metrics_path: /probe
    params:
      module: [http_health]
    static_configs:
      - targets: ["http://demo-api:8000/health/live", "http://demo-api:8000/health/ready"]
        labels:
          service: demo-api
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  - job_name: "fault-injector"
    static_configs:
      - targets: ["fault-injector:8000"]
        labels:
          service: fault-injector
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "demo-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["demo-api:8000"]
        labels:
          service: "demo-api"
          tier: "workload"

  - job_name: "demo-worker"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["demo-worker:9102"]
        labels:
          service: "demo-worker"
          tier: "worker"

  - job_name: "control-plane"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["control-plane:8000"]
        labels:
          service: "control-plane"
          tier: "management"

  - job_name: "node-exporter"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: "node-exporter"
          tier: "infrastructure"

  - job_name: "cAdvisor"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          service: "cadvisor"
          tier: "infrastructure"
