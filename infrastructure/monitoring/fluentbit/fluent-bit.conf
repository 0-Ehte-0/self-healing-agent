[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020

[INPUT]
    Name         tail
    Path         /var/lib/docker/containers/*/*-json.log
    Parser       docker
    Tag          docker.*
    Path_Key     log_file
    DB           /fluent-bit/state/tail.db
    Read_from_Head On
    Ignore_Older 1d
    Mem_Buf_Limit 20MB
    Skip_Long_Lines On

[FILTER]
    Name         parser
    Match        docker.*
    Key_Name     log
    Parser       json
    Reserve_Data True

[FILTER]
    Name         record_modifier
    Match        docker.*
    Record       job fluentbit

[FILTER]
    Name         lua
    Match        docker.*
    Script       /fluent-bit/etc/normalize.lua
    Call         normalize

[OUTPUT]
    Name                   loki
    Match                  *
    Host                   loki
    Port                   3100
    Labels                 job=fluentbit, environment=local
    Label_Keys             $service, $level, $scenario_id, $correlation_id, $container_id
    Auto_Kubernetes_Labels Off
    Drop_Single_Key        Off
