version: "3.8"

networks:
  self-healing-net:
    name: self-healing-net
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  chroma_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: self-healing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: control_plane
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/compose/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d control_plane"]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - self-healing-net

  redis:
    image: redis:7-alpine
    container_name: self-healing-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - self-healing-net

  chromadb:
    image: chromadb/chroma:0.5.0
    container_name: self-healing-chroma
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/v1/heartbeat\")'"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - self-healing-net

  demo-api:
    build:
      context: .
      dockerfile: apps/demo-api/Dockerfile
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/self_healing
      - REDIS_URL=redis://redis:6379/0
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - postgres
      - redis

  demo-worker:
    build:
      context: .
      dockerfile: apps/demo-worker/Dockerfile
    ports:
      - "8002:8000"
      - "9102:9102"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  traffic-generator:
    build:
      context: .
      dockerfile: apps/traffic-generator/Dockerfile
    environment:
      - TARGET_API_URL=http://demo-api:8000
      - RATE_RPS=10.0
      - RANDOM_SEED=42
    depends_on:
      - demo-api

  fault-injector:
    build:
      context: .
      dockerfile: apps/fault-injector/Dockerfile
    ports:
      - "8003:8000"
    environment:
      - FAULT_INJECTOR_SECRET=injector-secret-token
      - DEMO_API_URL=http://demo-api:8000
      - REDIS_URL=redis://redis:6379/0