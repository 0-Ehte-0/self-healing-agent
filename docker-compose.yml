version: "3.8"

networks:
  self-healing-net:
    name: self-healing-net
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  chroma_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: self-healing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: control_plane
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/compose/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d control_plane"]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - self-healing-net

  redis:
    image: redis:7-alpine
    container_name: self-healing-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - self-healing-net

  chromadb:
    image: chromadb/chroma:0.5.0
    container_name: self-healing-chroma
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/v1/heartbeat\")'"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - self-healing-net