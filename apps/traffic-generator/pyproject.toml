[project]
name = "traffic-generator"
version = "0.1.0"
description = "Traffic workload generator with seeded randomness"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic-settings>=2.2.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"