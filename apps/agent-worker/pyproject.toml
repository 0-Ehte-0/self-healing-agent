[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "redis>=5.0.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.2.0",
    "agent-core",
    "shared-models",
    "diagnosis",
    "action-catalog",
    "policy-engine",
    "provider-adapters",
    "telemetry-client",
]


[tool.setuptools.packages.find]
where = ["."]

[project.scripts]
agent-worker = "agent_worker.main:main"
