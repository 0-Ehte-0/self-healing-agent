[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "control-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "redis>=5.0.4",
    "httpx>=0.27.0",
    "alembic>=1.13.1",
    "shared-models",
]

[tool.setuptools.packages.find]
where = ["."]

[project.scripts]
control-api = "app.main:start"