name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: control_plane
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio httpx pyyaml
          pip install -e packages/shared-models
          pip install -e packages/telemetry-client
          pip install -e packages/policy-engine
          pip install -e packages/provider-adapters
          pip install -e packages/diagnosis
          pip install -e packages/action-catalog
          pip install -e packages/agent-core
          pip install -e apps/control-api
          pip install -e apps/agent-worker
          pip install -e apps/demo-api
          pip install -e apps/demo-worker
          pip install -e apps/traffic-generator
          pip install -e apps/fault-injector

      - name: Run Linting and Formatting Check
        run: |
          ruff check .
          ruff format --check .

      - name: Run Database Migrations and Seed
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/control_plane
        run: |
          cd apps/control-api
          alembic upgrade head
          python -m app.db.seed

      - name: Run Tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/control_plane
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/control_plane
          OTEL_SDK_DISABLED: "true"
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest
