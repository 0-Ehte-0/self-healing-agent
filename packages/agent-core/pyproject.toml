[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint>=2.0.0",
    "shared-models",
]

[tool.setuptools.packages.find]
where = ["."]
