[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diagnosis"
version = "0.1.0"
description = "Bounded evidence collection and deterministic diagnosis rules for autonomous self-healing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
]
