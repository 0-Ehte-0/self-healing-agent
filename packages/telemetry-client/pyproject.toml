[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telemetry-client"
version = "0.1.0"
description = "Typed, resource-scoped Prometheus and Loki telemetry clients with bounds and timeouts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]
