[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "action-catalog"
version = "0.1.0"
description = "Typed action catalog, deterministic mapper, and security-hardened plan validator for autonomous self-healing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
]
