[tool.ruff]
target-version = "py312"
line-length = 100


[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    # "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    # "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
]
ignore = ["B007","B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["apps", "packages", "tests"]
asyncio_mode = "auto"
pythonpath = [
    "apps/control-api",
    "apps/demo-api",
    "apps/demo-worker",
    "apps/traffic-generator",
    "apps/fault-injector",
    "apps/agent-worker",
    "packages/shared-models",
    "packages/agent-core",
    "packages/telemetry-client",
    "packages/diagnosis",
    "packages/action-catalog",
]